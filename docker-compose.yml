# Blog Platform (InkStone) — 生产部署编排
#
# 用法：
#   1. cp .env.example .env && 编辑 .env（改 DB_PASSWORD / JWT_SECRET / 域名）
#   2. docker compose up -d --build
#
# 详细教程见 README.md

services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: inkstone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-blog_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-blog} -d ${DB_NAME:-blog_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: inkstone-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-blog}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-blog_platform}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8080}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - uploads_data:/app/data
    ports:
      # 如已在前面挂 Nginx/Caddy 反向代理，建议改为 "127.0.0.1:8080:8080"
      - "${BACKEND_BIND:-0.0.0.0}:8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: inkstone-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      # 如已在前面挂 Nginx/Caddy 反向代理，建议改为 "127.0.0.1:3000:3000"
      - "${FRONTEND_BIND:-0.0.0.0}:3000:3000"

volumes:
  postgres_data:
  uploads_data:
