# InkStone 一键离线部署编排（离线镜像方式）。
# 用法：docker load -i inkstone-images.tar 后，
#       cd <部署目录> && docker compose --env-file .env -f docker-compose.offline.yml up -d
# backend 挂载 docker.sock 后，后台「系统更新」页即可全自动完成后续版本升级（无需登录服务器）。
services:
  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: blog-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-blog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-blog_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-blog} -d ${DB_NAME:-blog_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: inkstone-backend:latest
    container_name: blog-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-blog}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-blog_platform}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-https://blog.shenv.top}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://blog.shenv.top}
      # 发布仓库（fork 用户改成自己的 owner/repo）
      UPDATE_REPO: ${UPDATE_REPO:-shenwei234/inkstone}
    volumes:
      - uploads_data:/app/data
      # 自动更新：backend 经 Docker API 拉取镜像包并替换容器（只读挂载，宿主机零操作）
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # 最小权限：Go 静态服务无需任何 capability；被 RCE 时降低影响面
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    image: inkstone-frontend:latest
    container_name: blog-frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
